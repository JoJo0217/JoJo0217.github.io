<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Personal webpage for Mingyu Jo, machine learning researcher."
    />
    <title>Mingyu Jo</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="home">
    <header class="site-header">
      <a class="brand" href="index.html" data-text="name">Mingyu Jo</a>
      <nav class="nav" aria-label="Primary navigation">
        <a class="active" href="index.html">about</a>
        <a href="publications.html">publications</a>
        <a href="cv.html">cv</a>
      </nav>
    </header>

    <main class="page">
      <section class="intro" aria-labelledby="intro-title">
        <div class="intro-copy">
          <h1 id="intro-title" data-text="name">Mingyu Jo</h1>
          <p class="subtitle" data-text="headline"></p>
          <div class="body-text" data-list="bio"></div>
          <p class="contact-line" data-list="links"></p>
        </div>

        <aside class="portrait-card" aria-label="Profile visual">
          <img data-image="photo" alt="Profile visual" />
        </aside>
      </section>

      <section class="content-section" aria-labelledby="service-title">
        <h2 id="service-title">Academic Service</h2>
        <div class="service-list" data-list="academicService"></div>
      </section>

      <section class="content-section" aria-labelledby="news-title">
        <h2 id="news-title">News</h2>
        <div class="news-list" data-list="news"></div>
      </section>

      <section class="content-section" aria-labelledby="selected-title">
        <div class="section-title-row">
          <h2 id="selected-title">Selected Publications</h2>
          <a class="text-link" href="publications.html">all publications</a>
        </div>
        <div class="publication-list compact" data-list="selectedPublications"></div>
      </section>
    </main>

    <footer class="site-footer">
      <span data-text="footer"></span>
    </footer>

    <script src="content.js"></script>
    <script src="site.js"></script>
  </body>
</html>
