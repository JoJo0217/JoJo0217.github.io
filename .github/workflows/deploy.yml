name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "publications.html"
      - "cv.html"
      - "content.js"
      - "site.js"
      - "styles.css"
      - "assets/files/**"
      - "cv/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile CV
        uses: xu-cheng/latex-action@v4
        with:
          root_file: Mingyu_Jo_CV.tex
          working_directory: cv
          texlive_version: 2026
      - name: Prepare static website
        run: |
          test -s cv/Mingyu_Jo_CV.pdf
          mkdir -p _site/assets
          cp index.html publications.html cv.html content.js site.js styles.css .nojekyll _site/
          cp -R assets/files _site/assets/
          cp cv/Mingyu_Jo_CV.pdf _site/assets/files/Mingyu_Jo_CV.pdf
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
